name: Inspect allbars

on:
  push:
    branches:
      - chatgpt-loop-simulation
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/inspect-allbars.mjs
